extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  # CockroachDB exposes Prometheus-format metrics on every node's HTTP port
  # at /_status/vars. Each node reports its own store/node metrics plus a
  # cluster-wide view, so scrape all of them.
  prometheus:
    config:
      scrape_configs:
        - job_name: "cockroachdb"
          scrape_interval: ${env:CRDB_SCRAPE_INTERVAL}
          metrics_path: "/_status/vars"
          static_configs:
            - targets: ["roach1:8080"]
              labels:
                crdb_node: "roach1"
            - targets: ["roach2:8080"]
              labels:
                crdb_node: "roach2"
            - targets: ["roach3:8080"]
              labels:
                crdb_node: "roach3"
          relabel_configs:
            # Stamp a logical cluster name on every series so multiple
            # clusters can share one Oodle instance.
            - target_label: "crdb_cluster"
              replacement: "${env:CRDB_CLUSTER_NAME}"

processors:
  # Guard against the collector OOMing if Oodle is briefly unreachable and
  # the retry queue grows.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 1024

  # Every rewrite below is CockroachDB-specific, so each one is guarded on the
  # scrape job. The Prometheus receiver maps job_name to the service.name
  # resource attribute, which is also what Oodle renders as the `job` label.
  # Without the guard, adding any other scrape job to this pipeline would
  # rename that job's metrics, restamp its job label, and strip its scope.
  transform/crdb:
    metric_statements:
      # CockroachDB's exposition uses bare names (sql_query_count, ranges,
      # capacity_used) that collide with anything else landing in the same
      # Oodle instance. Namespace them so the whole cluster is one `crdb_*`
      # prefix search away.
      #
      # `up` and `scrape_*` are excluded: the receiver synthesizes those about
      # the scrape itself rather than reading them from CockroachDB, and `up`
      # is a cross-ecosystem convention that alerting expects under that exact
      # name. The ^crdb_ guard keeps the rename idempotent.
      - context: metric
        conditions:
          - resource.attributes["service.name"] == "cockroachdb"
        statements:
          - set(name, Concat(["crdb_", name], ""))
              where not IsMatch(name, "^crdb_")
              and not IsMatch(name, "^(up|scrape_.*)$")

      # Oodle turns every OTLP resource attribute into a metric label. The
      # Prometheus receiver attaches scrape-target metadata as resource
      # attributes, all of which restate `instance`, so drop them rather than
      # carry six redundant labels on every one of ~2.4k series.
      #
      # service.name is left alone: the receiver already set it to the job
      # name, and overwriting it would relabel other jobs as `cockroachdb`.
      - context: resource
        conditions:
          - attributes["service.name"] == "cockroachdb"
        statements:
          - set(attributes["db.system"], "cockroachdb")
          - delete_key(attributes, "net.host.name")
          - delete_key(attributes, "net.host.port")
          - delete_key(attributes, "server.address")
          - delete_key(attributes, "server.port")
          - delete_key(attributes, "http.scheme")
          - delete_key(attributes, "url.scheme")

      # Same idea for the instrumentation scope: the receiver's own package
      # path is not useful as a label on every CockroachDB series.
      - context: scope
        conditions:
          - resource.attributes["service.name"] == "cockroachdb"
        statements:
          - set(name, "")
          - set(version, "")

exporters:
  otlphttp/oodle:
    endpoint: "https://${env:OODLE_INSTANCE}-otlp.collector.oodle.ai"
    headers:
      "X-OODLE-INSTANCE": "${env:OODLE_INSTANCE}"
      "X-API-KEY": "${env:OODLE_API_KEY}"
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    sending_queue:
      enabled: true
      queue_size: 1000

  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, transform/crdb, batch]
      exporters: [otlphttp/oodle, debug]
