services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: codex-demo-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4318:4318"   # OTLP HTTP (client + Codex native export)
      - "4317:4317"   # OTLP gRPC (Codex native export)
      - "13133:13133" # Health check
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
      - OODLE_OTLP_ENDPOINT=${OODLE_OTLP_ENDPOINT:-https://${OODLE_INSTANCE}-otlp.collector.oodle.ai}

networks:
  default:
    name: codex-demo-net
