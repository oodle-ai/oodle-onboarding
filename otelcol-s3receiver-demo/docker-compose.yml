# The "S3 bucket": a local MinIO (S3-compatible) plus one-shot bucket creation.
# The collector and lambda runner are launched by verify.py on this network.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Host bindings are only for manual/console use; the collector and lambdas
      # reach MinIO over the internal network at minio:9000. Override the host
      # ports if 9000/9001 are taken: MINIO_API_PORT=19000 docker compose up ...
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console (minioadmin / minioadmin)

  # Run once (`docker compose run --rm createbucket`) to make the bucket.
  createbucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/otel;
      echo bucket-ready"

networks:
  default:
    name: otel-s3-demo
