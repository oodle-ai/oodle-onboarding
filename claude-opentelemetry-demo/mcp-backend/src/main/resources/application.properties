spring.application.name=mcp-backend
demo.role=${DEMO_ROLE:web}
server.port=${PORT:8000}

spring.datasource.url=jdbc:mariadb://${DB_HOST:mariadb}:3306/meta_db
spring.datasource.username=lxuser
spring.datasource.password=${DB_PASSWORD:lxpass}
# The one-shot roles never touch the database; do not fail them on startup.
spring.datasource.hikari.initialization-fail-timeout=-1

management.endpoints.web.exposure.include=health
spring.main.banner-mode=off
