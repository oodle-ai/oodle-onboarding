services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: claude-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4330:4318"
      - "13145:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    networks:
      - claude-otel-net

  # The three sub-demos are one-shot scripts: `docker compose run --rm <service>`.
  messages-api:
    profiles: ["demo"]
    build: ./messages-api
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=claude-otel-messages-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector
    networks:
      - claude-otel-net

  claude-sdk:
    profiles: ["demo"]
    build: ./claude-sdk
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=claude-otel-sdk
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector
    networks:
      - claude-otel-net

  managed-agents:
    profiles: ["demo"]
    build: ./managed-agents
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=claude-otel-managed-agents
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector
    networks:
      - claude-otel-net

  # mcp-backend: two long-running servers, a tunnel, and a one-shot driver.
  # The firm database, seeded once from db/init.sql on first start.
  mcp-mariadb:
    profiles: ["mcp"]
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_USER: lxuser
      MARIADB_PASSWORD: lxpass
    volumes:
      - mcp-db:/var/lib/mysql
      - ./mcp-backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    networks:
      claude-otel-net:
        aliases: [mariadb]

  mcp-web:
    profiles: ["mcp"]
    build: ./mcp-backend
    env_file: .env
    environment: &mcp-otel
      DEMO_ROLE: web
      PORT: "8000"
      # The extension adds the `mcpurl` propagator. It acts only on a request
      # whose URL has `tp`, which mcp-app adds when MCP_TRACE_CONTEXT_IN_URL
      # is true; listed last so it wins over the connector's traceparent.
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.extensions=/otel/mcp-url-propagator.jar
      OTEL_PROPAGATORS: tracecontext,baggage,mcpurl
      MCP_TRACE_CONTEXT_IN_URL: ${MCP_TRACE_CONTEXT_IN_URL:-false}
      OTEL_SERVICE_NAME: claude-otel-mcp-web
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=demo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      otel-collector:
        condition: service_started
      mcp-mariadb:
        condition: service_healthy
    networks:
      - claude-otel-net

  mcp-app:
    profiles: ["mcp"]
    build: ./mcp-backend
    env_file: .env
    environment:
      <<: *mcp-otel
      DEMO_ROLE: app
      PORT: "8001"
      OTEL_SERVICE_NAME: claude-otel-mcp-app
    depends_on:
      otel-collector:
        condition: service_started
      mcp-mariadb:
        condition: service_healthy
      mcp-web:
        condition: service_started
      mcp-tunnel:
        condition: service_started
    networks:
      - claude-otel-net

  # A cloudflared quick tunnel: a temporary public HTTPS URL for mcp-web,
  # which Anthropic's MCP connector needs. No account. mcp-app reads the
  # hostname from the metrics port's /quicktunnel endpoint.
  mcp-tunnel:
    profiles: ["mcp"]
    image: cloudflare/cloudflared:2024.12.2
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://mcp-web:8000"]
    depends_on:
      - mcp-web
    networks:
      - claude-otel-net

  # The one-shot roles: the driver (the default) and `provision`. No Java
  # agent, no web server.
  mcp-backend:
    profiles: ["mcp"]
    build: ./mcp-backend
    env_file: .env
    environment:
      DEMO_ROLE: driver
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      - mcp-app
    networks:
      - claude-otel-net

volumes:
  mcp-db:

networks:
  claude-otel-net:
    driver: bridge
