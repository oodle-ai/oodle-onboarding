name: Fieldwork mobile demo
on:
  pull_request:
    paths:
      - datadog/fieldwork-mobile-demo/**
      - .github/workflows/fieldwork-mobile-demo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: datadog/fieldwork-mobile-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: datadog/fieldwork-mobile-demo/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run export:web
      - run: npm run export:native
      - run: docker compose up --build --wait --wait-timeout 180
      - run: npm run smoke:stack
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down --volumes
