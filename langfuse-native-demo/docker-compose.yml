services:
  app:
    build: ./app
    container_name: langfuse-native-demo
    environment:
      # The Langfuse SDK exports to this URL with its own exporter.
      - LANGFUSE_BASE_URL=https://${OODLE_API_DOMAIN:-us1.oodle.ai}/v1/api/instance/${OODLE_INSTANCE}/langfuse
      - LANGFUSE_PUBLIC_KEY=default
      - LANGFUSE_SECRET_KEY=${OODLE_API_KEY}
      # The service name and environment the traces carry.
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-langfuse-native-demo}
      - LANGFUSE_TRACING_ENVIRONMENT=${LANGFUSE_TRACING_ENVIRONMENT:-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_GATEWAY_URL:-https://api.openai.com/v1}
      - MODEL=${MODEL:-gpt-4o-mini}
