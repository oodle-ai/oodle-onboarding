x-app: &app
  build:
    context: ./app
    dockerfile: Dockerfile
  environment:
    - TEMPORAL_HOST=temporal:7233
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    - OTEL_EXPORTER_OTLP_ENDPOINT_HTTP=http://otel-collector:4318
    - OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental
    - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=span_and_event
    - OODLE_APP_URL=${OODLE_APP_URL:-https://app.oodle.ai}
    - OODLE_INSTANCE=${OODLE_INSTANCE}
    - OODLE_API_KEY=${OODLE_API_KEY}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    - PROMPT_NAME=${PROMPT_NAME:-order-support-agent}
    - AGENT_NAME=${AGENT_NAME:-order_support_agent}
    - SERVICE_NAME=${SERVICE_NAME:-support-agent}
    - INSIGHT_POLL_SECONDS=${INSIGHT_POLL_SECONDS:-120}
    - IMPROVER_COOLDOWN_MINUTES=${IMPROVER_COOLDOWN_MINUTES:-10}
    - IMPROVER_MAX_ATTEMPTS=${IMPROVER_MAX_ATTEMPTS:-3}
  networks:
    - sil-net

services:
  postgresql:
    image: postgres:16-alpine
    container_name: sil-postgresql
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    networks:
      - sil-net

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: sil-temporal
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - PROMETHEUS_ENDPOINT=0.0.0.0:8000
    ports:
      - "7236:7233"
    networks:
      - sil-net

  temporal-ui:
    image: temporalio/ui:2.35.0
    container_name: sil-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8083:8080"
    networks:
      - sil-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: sil-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "13153:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    depends_on:
      - temporal
    networks:
      - sil-net

  worker:
    <<: *app
    container_name: sil-worker
    restart: on-failure
    command: ["python", "-u", "worker.py"]
    depends_on:
      - temporal
      - otel-collector

networks:
  sil-net:
    driver: bridge
