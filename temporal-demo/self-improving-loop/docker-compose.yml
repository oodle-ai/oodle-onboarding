x-app: &app
  build:
    context: ./app
    dockerfile: Dockerfile
  environment:
    - TEMPORAL_HOST=temporal:7233
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    - OTEL_EXPORTER_OTLP_ENDPOINT_HTTP=http://otel-collector:4318
    - OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental
    - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=span_and_event
    - OODLE_APP_URL=${OODLE_APP_URL:-https://app.oodle.ai}
    - OODLE_INSTANCE=${OODLE_INSTANCE}
    - OODLE_API_KEY=${OODLE_API_KEY}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    - PROMPT_NAME=${PROMPT_NAME:-order-support-agent}
    - AGENT_NAME=${AGENT_NAME:-order_support_agent}
    - SERVICE_NAME=${SERVICE_NAME:-support-agent}
    - INSIGHT_POLL_SECONDS=${INSIGHT_POLL_SECONDS:-120}
    - IMPROVER_COOLDOWN_MINUTES=${IMPROVER_COOLDOWN_MINUTES:-10}
    - IMPROVER_MAX_ATTEMPTS=${IMPROVER_MAX_ATTEMPTS:-3}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
    - SLACK_CHANNEL=${SLACK_CHANNEL:-}
    - TEMPORAL_UI_URL=${TEMPORAL_UI_URL:-http://localhost:8083}
    - DEMO_UI_URL=${DEMO_UI_URL:-http://localhost:8090}
    - DATASET_NAME=${DATASET_NAME:-order-support-eval}
    - TUNNEL_METRICS_URL=http://tunnel:2000
  networks:
    - sil-net

services:
  postgresql:
    image: postgres:16-alpine
    container_name: sil-postgresql
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    networks:
      - sil-net

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: sil-temporal
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - PROMETHEUS_ENDPOINT=0.0.0.0:8000
    ports:
      - "7236:7233"
    networks:
      - sil-net

  temporal-ui:
    image: temporalio/ui:2.35.0
    container_name: sil-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8083:8080"
    networks:
      - sil-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: sil-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "13153:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    depends_on:
      - temporal
    networks:
      - sil-net

  worker:
    <<: *app
    container_name: sil-worker
    restart: on-failure
    command: ["python", "-u", "worker.py"]
    depends_on:
      - temporal
      - otel-collector

  web:
    <<: *app
    container_name: sil-web
    restart: on-failure
    command: ["python", "-u", "web.py"]
    ports:
      - "8090:8090"
    depends_on:
      - temporal
      - otel-collector

  # Oodle's experiment runner calls the agent from the internet, so it needs a public
  # URL. A Cloudflare quick tunnel gives one with no account. It exposes only the
  # webhook port (8091), not the store or the approval page.
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    container_name: sil-tunnel
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://web:8091"]
    depends_on:
      - web
    networks:
      - sil-net

networks:
  sil-net:
    driver: bridge
