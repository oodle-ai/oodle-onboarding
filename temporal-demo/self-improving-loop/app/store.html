<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopWorld Support</title>
<style>
  :root { --green:#008060; --ink:#202223; --muted:#6d7175; --line:#e1e3e5; --bg:#f6f6f7; --bad:#d72c0d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 28px; display:flex; align-items:center; gap:24px; }
  .logo { font-weight:700; font-size:20px; letter-spacing:-.3px; }
  .logo span { color:var(--green); }
  nav { display:flex; gap:18px; color:var(--muted); }
  nav a { color:inherit; text-decoration:none; }
  .spacer { flex:1; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px; background:#e3f1df; color:#1a5c3a; text-decoration:none; }
  main { max-width:1180px; margin:24px auto; padding:0 20px; display:grid; grid-template-columns:1fr 420px; gap:24px; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
  h2 { font-size:16px; margin:0 0 12px; }
  .orders { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; }
  .thumb { height:110px; border-radius:8px; background:linear-gradient(135deg,#dfe9e4,#f3efe6); display:grid; place-items:center; font-size:40px; margin-bottom:10px; }
  .muted { color:var(--muted); font-size:12px; }
  .status { font-size:11px; padding:2px 8px; border-radius:6px; background:#f1f1f1; }
  .chat { background:#fff; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; height:calc(100vh - 110px); min-height:520px; position:sticky; top:20px; }
  .chat-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-weight:700; }
  .log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#f1f2f3; border-bottom-left-radius:4px; }
  .meta { align-self:flex-start; font-size:11px; color:var(--muted); margin-top:-6px; }
  .meta a { color:inherit; }
  .chips { padding:8px 12px 0; display:flex; flex-wrap:wrap; gap:6px; }
  .chips .chip { font-size:12px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:400; border-radius:999px; padding:4px 10px; cursor:pointer; }
  .chip:hover { border-color:var(--green); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); margin-top:8px; }
  textarea { flex:1; resize:none; height:44px; border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  button { background:var(--green); color:#fff; border:0; border-radius:8px; padding:0 16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .typing { align-self:flex-start; color:var(--muted); font-size:12px; }
  /* Who runs the support desk: a toddler on prompt v1, a plumber on any later version. */
  .track { margin-left:auto; width:110px; height:44px; position:relative; overflow:hidden; }
  .track::after { content:""; position:absolute; left:0; right:0; bottom:2px; height:2px;
    background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px);
    animation:ground var(--ground) linear infinite; }
  .track svg { position:absolute; bottom:4px; left:50%; transform:translateX(-50%); shape-rendering:crispEdges; image-rendering:pixelated; }
  .track .f1 { animation:leg-a var(--step) steps(1) infinite; }
  .track .f2 { opacity:0; animation:leg-b var(--step) steps(1) infinite; }
  .track.toddler { --step:.5s; --ground:2.4s; }
  .track.toddler svg { animation:wobble 1s ease-in-out infinite; }
  .track.plumber { --step:.14s; --ground:.35s; }
  .track.plumber svg { animation:bob .28s steps(1) infinite; }
  @keyframes leg-a { 0% { opacity:1; } 50%,100% { opacity:0; } }
  @keyframes leg-b { 0% { opacity:0; } 50%,100% { opacity:1; } }
  @keyframes ground { to { background-position:-14px 0; } }
  @keyframes wobble { 0%,100% { transform:translateX(-50%) rotate(-5deg); } 50% { transform:translateX(-50%) rotate(5deg); } }
  @keyframes bob { 0% { transform:translateX(-50%); } 50% { transform:translateX(-50%) translateY(-2px); } }
  @media (prefers-reduced-motion:reduce) { .track *, .track::after { animation:none !important; } .track .f2 { opacity:0; } }
</style>
</head>
<body>
<header>
  <div class="logo">Shop<span>World</span></div>
  <nav><a href="#">Shop</a><a href="#">Orders</a><a href="#">Help</a></nav>
  <div class="spacer"></div>
  <a class="pill" id="prompt" target="_blank">prompt v?</a>
  <a class="pill" href="/approval" style="background:#fff4e5;color:#8a5a00">Prompt improver</a>
</header>
<main>
  <section>
    <h2>Your recent orders</h2>
    <div class="orders" id="orders"></div>
  </section>
  <aside class="chat">
    <div class="chat-head"><div class="avatar">S</div><div><b>ShopWorld support</b></div><div class="track" id="runner"></div></div>
    <div class="log" id="log"><div class="msg bot">Hi! Tell me what went wrong with your order and I will sort it out.</div></div>
    <div class="chips" id="chips"></div>
    <form id="form"><textarea id="text" placeholder="Describe your problem..."></textarea><button id="send">Send</button></form>
  </aside>
</main>
<script>
const ICONS = {"ORD-78432":"🫖","ORD-51907":"🧦","ORD-66120":"💡","ORD-40388":"🧊"};
const $ = id => document.getElementById(id);

// Pixel sprites, one character per pixel. The body is shared, the legs alternate.
const SPRITES = {
  toddler: {px: 3, colors: {H:"#7a4a1e", S:"#f6c9a0", K:"#222", P:"#e0707a", B:"#5aa0e6", W:"#fff", O:"#e85d75"},
    title: "Prompt v1: still learning to walk. About 5 model calls and 2 failed tool calls per ticket.",
    body: ["....HHHH....", "...HHHHHH...", "..HSSSSSSH..", "..SSKSSKSS..", "..SSSSSSSS..", "..SSSPPSSS..",
           "...SSSSSS...", "....BBBB....", "..SBBBBBBS..", ".SS.BBBB.SS.", "....WWWW....", "...WWWWWW..."],
    legs: [["...SS..SS...", "..SS....SS..", "..OO....OO.."], ["....SSSS....", "....SS.SS...", "....OO.OO..."]]},
  plumber: {px: 2.4, colors: {R:"#e52521", N:"#6b3a12", S:"#f8c48c", K:"#1b1b1b", M:"#3b1d0a", B:"#2b5fd9", Y:"#ffd400"},
    title: "Improved prompt: running at full speed. Right tool arguments first time.",
    body: ["....RRRRRR....", "...RRRRRRRRR..", "...RRRRRRRRRRR", "...NNSSSKS....", "..NSSSSSKSSS..", "..NSSSSSSSSSS.",
           "...SSSSMMMMM..", "....SSSSSSS...", "...RRBRRBRR...", "..RRRBBBBRRR..", "..SSBBYBYBBSS.", "..SSBBBBBBBSS.",
           "....BBBBBBB..."],
    legs: [["...BBB..BBB...", "..NNN....NNN..", ".NNNN....NNNN."], ["....BBBBBB....", ".....NNNNN....", "....NNNNNNN..."]]},
};

function sprite(name) {
  const sp = SPRITES[name], w = sp.body[0].length, h = sp.body.length + sp.legs[0].length;
  const rects = rows => rows.map((row, y) => [...row].map((c, x) => sp.colors[c]
    ? `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${sp.colors[c]}"/>` : "").join("")).join("");
  const frame = (legs, cls) => `<g class="${cls}">${rects([...sp.body, ...legs])}</g>`;
  return `<svg width="${w * sp.px}" height="${h * sp.px}" viewBox="0 0 ${w} ${h}" aria-hidden="true">` +
    frame(sp.legs[0], "f1") + frame(sp.legs[1], "f2") + `</svg>`;
}

function showRunner(version) {
  const name = version === 1 ? "toddler" : "plumber", el = $("runner");
  if (el.dataset.name === name) return;  // keep the animation running across refreshes
  el.dataset.name = name; el.className = "track " + name;
  el.title = SPRITES[name].title; el.innerHTML = sprite(name);
}
function add(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("log").append(d); $("log").scrollTop = 1e9; return d; }

async function load() {
  const s = await (await fetch("/api/store")).json();
  $("prompt").textContent = "live prompt v" + s.prompt_version; $("prompt").href = s.prompt_url;
  showRunner(s.prompt_version);
  $("orders").innerHTML = Object.entries(s.orders).map(([id, o]) =>
    `<div class="card"><div class="thumb">${ICONS[id] || "📦"}</div><b>${o.item}</b>
     <div class="muted">${id} · ${o.total}</div><span class="status">${o.status.replace("_", " ")}</span></div>`).join("");
  $("chips").innerHTML = "";
  for (const t of s.tickets) {
    const c = document.createElement("button"); c.type = "button"; c.className = "chip";
    c.textContent = t.id + ": " + t.text.slice(0, 38) + "…";
    c.onclick = () => send(t.text, t.id); $("chips").append(c);
  }
}

async function send(text, id) {
  $("send").disabled = true; add("msg me", text);
  const wait = add("typing", "Agent is working…");
  try {
    const r = await fetch("/api/ticket", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({text, id})});
    const res = r.ok ? await r.json() : {error: await r.text()};
    wait.remove();
    if (res.error) { add("msg bot", "Sorry, something went wrong: " + res.error); return; }
    add("msg bot", res.reply || "(the agent ran out of turns)");
    const m = add("meta", "");
    m.innerHTML = `trace <a href="${res.trace_url}" target="_blank" rel="noopener">${res.trace_id.slice(0, 12)}…</a>`;
  } finally { $("send").disabled = false; load(); }
}

$("form").onsubmit = e => { e.preventDefault(); const t = $("text").value.trim(); if (t) { $("text").value = ""; send(t); } };
load();
</script>
</body>
</html>
