services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: jaeger-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "14268:14268"
      - "13133:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    networks:
      - jaeger-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: jaeger-demo-app
    ports:
      - "8080:8080"
    environment:
      - JAEGER_ENDPOINT=http://otel-collector:14268/api/traces
      - OTEL_SERVICE_NAME=jaeger-demo-service
    depends_on:
      - otel-collector
    networks:
      - jaeger-net

networks:
  jaeger-net:
    driver: bridge
