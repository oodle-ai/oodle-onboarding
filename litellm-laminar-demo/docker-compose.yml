services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: litellm-laminar-demo-app
    ports:
      - "8102:8102"
    environment:
      - LMNR_PROJECT_API_KEY=${LMNR_PROJECT_API_KEY}
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MODEL=${MODEL:-gpt-4o-mini}
      - REASONING_EFFORT=${REASONING_EFFORT:-medium}
      # Namespace for the 27 route-audit attributes.
      - ROUTE_ATTRIBUTE_PREFIX=${ROUTE_ATTRIBUTE_PREFIX:-agent.route.}
      - MOCK_LLM=${MOCK_LLM:-false}
      # Off by default: prompts, completions, tool schemas and tool/turn
      # payloads reach Laminar but not Oodle unless this is true.
      - OODLE_CAPTURE_MESSAGE_CONTENT=${OODLE_CAPTURE_MESSAGE_CONTENT:-false}
      # Context window the agent compacts against. Small, so a session of a
      # few messages compacts; the app's own default is 200000.
      - CONTEXT_WINDOW_TOKENS=${CONTEXT_WINDOW_TOKENS:-700}
      # Tool outputs longer than this, in a history longer than the minimum,
      # are trimmed once the context passes half the window. Small, so the
      # demo trims; the app's own defaults are 2000 and 50.
      - TOOL_TRIM_CHAR_THRESHOLD=${TOOL_TRIM_CHAR_THRESHOLD:-200}
      - TOOL_TRIM_MIN_MESSAGES=${TOOL_TRIM_MIN_MESSAGES:-4}
      - SERVICE_NAME=litellm-laminar-demo
      - ENV=demo
      - PORT=8102
