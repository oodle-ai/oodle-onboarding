services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: zipkin-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "9411:9411"
      - "13133:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    networks:
      - zipkin-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: zipkin-demo-app
    ports:
      - "8080:8080"
    environment:
      - ZIPKIN_ENDPOINT=http://otel-collector:9411/api/v2/spans
      - OTEL_SERVICE_NAME=zipkin-demo-service
    depends_on:
      - otel-collector
    networks:
      - zipkin-net

networks:
  zipkin-net:
    driver: bridge
