receivers:
  awss3:
    starttime: "${env:START_TIME}"
    endtime: "${env:END_TIME}"
    s3downloader:
      region: us-east-1
      s3_bucket: otel
      s3_prefix: telemetry
      endpoint: http://minio:9000
      s3_force_path_style: true
      s3_partition_format: "year=%Y/month=%m/day=%d/hour=%H/minute=%M"

exporters:
  # Minimal-overhead sink so CPU/mem reflects the receiver, not the sink.
  nop:

service:
  pipelines:
    metrics:
      receivers: [awss3]
      exporters: [nop]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
    logs:
      level: info
