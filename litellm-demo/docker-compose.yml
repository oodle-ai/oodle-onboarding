services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: litellm-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4325:4318"
      - "13140:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    networks:
      - litellm-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: litellm-demo-app
    ports:
      - "8096:8096"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_GATEWAY_URL=${OPENAI_GATEWAY_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - MODEL=${MODEL:-gpt-4o-mini}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # Without this LiteLLM names the span litellm_request and
      # writes no gen_ai.operation.name, and Agent Observability
      # lists nothing.
      - OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental
      # `true` here means events only, which leaves the span
      # attributes empty.
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=span_and_event
      # LiteLLM has no code hook for the resource, so the service
      # name comes from the environment. It defaults to "litellm".
      - OTEL_SERVICE_NAME=litellm-demo
      - PORT=8096
    depends_on:
      - otel-collector
    networks:
      - litellm-net

networks:
  litellm-net:
    driver: bridge
