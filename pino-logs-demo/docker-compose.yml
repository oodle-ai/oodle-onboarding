services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: pino-logs-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4329:4318"
      - "13144:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    networks:
      - pino-logs-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pino-logs-demo-app
    ports:
      - "8100:8100"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=pino-logs-demo
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=8100
    depends_on:
      - otel-collector
    networks:
      - pino-logs-net

networks:
  pino-logs-net:
    driver: bridge
