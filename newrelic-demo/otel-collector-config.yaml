receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  # the OTel SDK also traces this process's own telemetry uploads (its OTLP exporter and the New Relic
  # agent's collector calls) because both agents patch `http`; drop those so they don't count as transactions
  filter/self-telemetry:
    error_mode: ignore
    traces:
      span:
        - 'attributes["server.address"] == "otel-collector" or attributes["net.peer.name"] == "otel-collector"'
        - 'attributes["server.address"] == "collector.newrelic.com" or attributes["net.peer.name"] == "collector.newrelic.com"'
    metrics:
      datapoint:
        - 'attributes["server.address"] == "otel-collector" or attributes["net.peer.name"] == "otel-collector"'
        - 'attributes["server.address"] == "collector.newrelic.com" or attributes["net.peer.name"] == "collector.newrelic.com"'

  # APM reads the request, RPC and database duration histograms and
  # nothing else. The runtime metrics the SDKs emit by default
  # (nodejs_*, v8js_*, process_runtime_*) are dropped until a runtime
  # page needs them.
  filter/apm-metrics:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^(http\\.(server|client)\\.(request\\.)?duration|rpc\\.(server|client)\\.duration|db\\.client\\.(operation\\.)?duration)$")'

exporters:
  otlphttp/newrelic:
    endpoint: "https://otlp.nr-data.net"   # US region; EU is https://otlp.eu01.nr-data.net
    headers:
      "api-key": "${NEW_RELIC_LICENSE_KEY}"
    compression: gzip
  # Second destination. Only the OTel-instrumented services reach Oodle;
  # the New Relic agent path stays New Relic only, which is the comparison.
  otlphttp/oodle:
    endpoint: "${OODLE_OTLP_ENDPOINT}"
    headers:
      "X-OODLE-INSTANCE": "${OODLE_INSTANCE}"
      "X-API-KEY": "${OODLE_API_KEY}"
    compression: gzip
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/self-telemetry, batch]
      exporters: [otlphttp/newrelic, otlphttp/oodle, debug]
    metrics:
      receivers: [otlp]
      processors: [filter/self-telemetry, filter/apm-metrics, batch]
      exporters: [otlphttp/newrelic, otlphttp/oodle, debug]
