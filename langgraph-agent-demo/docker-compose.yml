services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: langgraph-agent-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4328:4318"
      - "13143:13133"
    environment:
      - OODLE_INSTANCE=${OODLE_INSTANCE}
      - OODLE_API_KEY=${OODLE_API_KEY}
    networks:
      - langgraph-agent-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: langgraph-agent-demo-app
    ports:
      - "8099:8099"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_GATEWAY_URL:-}
      - MODEL=${MODEL:-gpt-4o-mini}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - PORT=8099
    depends_on:
      - otel-collector
    networks:
      - langgraph-agent-net

  app-ts:
    build:
      context: ./app-ts
      dockerfile: Dockerfile
    container_name: langgraph-agent-demo-app-ts
    ports:
      - "8101:8101"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_GATEWAY_URL:-}
      - MODEL=${MODEL:-gpt-4o-mini}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=langgraph-agent-demo-ts
      - PORT=8101
    depends_on:
      - otel-collector
    networks:
      - langgraph-agent-net

networks:
  langgraph-agent-net:
    driver: bridge
