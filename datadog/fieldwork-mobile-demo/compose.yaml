name: fieldwork-one-demo
x-service: &service
  build: .
  environment: &environment
    DATABASE_URL: postgres://fieldwork:demo-local-only@postgres:5432/fieldwork
    REDIS_URL: redis://redis:6379
    SESSION_SECRET: ${SESSION_SECRET:-local-sample-change-before-sharing}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ENABLE_DEMO_SCENARIOS: ${ENABLE_DEMO_SCENARIOS:-true}
    DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
    DD_TRACE_AGENT_URL: http://datadog:8126
    DD_AGENT_HOST: datadog
    DD_ENV: ${DD_ENV:-demo}
    DD_VERSION: 1.0.0
    DD_LOGS_INJECTION: "true"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
services:
  api:
    <<: *service
    ports: ["${API_BIND_HOST:-127.0.0.1}:4310:4310"]
    environment:
      <<: *environment
      DD_SERVICE: fieldwork-demo-api
      RUN_WORKER: "false"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"fieldwork-demo-api"}]'
  worker:
    <<: *service
    command: ["node", "build/server/worker.js"]
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *environment
      DD_SERVICE: fieldwork-demo-worker
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"fieldwork-demo-worker"}]'
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldwork
      POSTGRES_PASSWORD: demo-local-only
      POSTGRES_DB: fieldwork
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldwork -d fieldwork"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  datadog:
    image: gcr.io/datadoghq/agent:7
    profiles: ["observability"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-demo}
      DD_HOSTNAME: fieldwork-one-demo
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"
      DD_CONTAINER_INCLUDE: "name:fieldwork-one-demo.*"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
volumes:
  postgres-data:
